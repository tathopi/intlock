<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Интеллектуальные системы контроля доступа">
  <defs>
    <linearGradient id="bg-access" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#14141d"/>
    </linearGradient>
    <radialGradient id="glow-access" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#227bf7" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#a65ff4" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-access" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="ring-access" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc9ff"/>
      <stop offset="55%" stop-color="#227bf7"/>
      <stop offset="100%" stop-color="#a65ff4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg-access)"/>
  <rect width="1200" height="900" fill="url(#grid-access)"/>
  <rect width="1200" height="900" fill="url(#glow-access)"/>
  <circle cx="600" cy="450" r="185" fill="none" stroke="url(#ring-access)" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="600" cy="450" r="215" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
  <g transform="translate(600 450) scale(9) translate(-12 -12)" fill="none" stroke="#eef4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
  </g>
</svg>
