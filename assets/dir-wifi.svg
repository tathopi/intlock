<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Корпоративная Wi-Fi сеть">
  <defs>
    <linearGradient id="bg-wifi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#14141d"/>
    </linearGradient>
    <radialGradient id="glow-wifi" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#227bf7" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#a65ff4" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-wifi" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="ring-wifi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc9ff"/>
      <stop offset="55%" stop-color="#227bf7"/>
      <stop offset="100%" stop-color="#a65ff4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg-wifi)"/>
  <rect width="1200" height="900" fill="url(#grid-wifi)"/>
  <rect width="1200" height="900" fill="url(#glow-wifi)"/>
  <circle cx="600" cy="450" r="185" fill="none" stroke="url(#ring-wifi)" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="600" cy="450" r="215" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
  <g transform="translate(600 450) scale(9) translate(-12 -12)" fill="none" stroke="#eef4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 10a10.5 10.5 0 0 1 14 0"/><path d="M8 13.4a6.3 6.3 0 0 1 8 0"/><path d="M10.7 16.8a2.4 2.4 0 0 1 2.6 0"/><circle cx="12" cy="19.7" r="1.3" fill="currentColor" stroke="none"/>
  </g>
</svg>
