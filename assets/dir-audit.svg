<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Технический аудит объекта">
  <defs>
    <linearGradient id="bg-audit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#14141d"/>
    </linearGradient>
    <radialGradient id="glow-audit" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#227bf7" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#a65ff4" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-audit" width="60" height="60" patternUnits="userSpaceOnUse">
